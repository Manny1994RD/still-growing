server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The API is served from the same address under /api, so the web app,
  # the phones and a tunnel only ever need one URL (e.g. https://growing.example.com/api).
  location /api/ {
    proxy_pass http://api:4000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
  }

  # Long cache for hashed bundles, no cache for the HTML shell.
  location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: every route falls back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
