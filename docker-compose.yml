name: still-growing

# Everything is reachable through the web container on one address:
#   http://<server>:8080        -> web app
#   http://<server>:8080/api    -> API (point the phone apps here)
# Optional: `docker compose --profile tunnel up -d` adds a Cloudflare Tunnel
# so phones can reach it securely (HTTPS) from anywhere.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: still_growing
      POSTGRES_USER: still_growing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U still_growing -d still_growing"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://still_growing:${POSTGRES_PASSWORD}@db:5432/still_growing
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ characters)}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    # Direct API port (optional; the web container already proxies /api).
    ports:
      - "${API_PORT:-4000}:4000"

  web:
    build:
      context: ./app
      args:
        # "/api" = same address as the web app (recommended).
        EXPO_PUBLIC_API_URL: ${PUBLIC_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

  # Secure access from anywhere without opening router ports.
  # Create a tunnel in the Cloudflare dashboard (Zero Trust > Networks > Tunnels),
  # point its public hostname to http://web:80, and put the token in .env.
  tunnel:
    image: cloudflare/cloudflared:2026.10.1
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - web

volumes:
  db-data:
